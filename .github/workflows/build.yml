name: Build, Test, and Deploy

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Environment to deploy"
        required: true
        default: test
        type: choice
        options:
          - test
          - prod
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 9.0.x
  SOLUTION_PATH: HamEventMVP.sln
  PROJECT_PATH: HamEvent/HamEvent.csproj

jobs:
  ci:
    name: CI Build and Test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        run: npm --prefix HamEvent/ClientApp ci

      - name: Verify i18n parity
        run: npm --prefix HamEvent/ClientApp run i18n:check

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

      - name: Publish build artifact
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --framework net9.0 --output ./publish --runtime win-x64 --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=false

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: publish
          retention-days: 7

  deploy_test:
    name: Deploy to TEST
    runs-on: windows-latest
    needs: ci
    timeout-minutes: 30
    environment: test
    if: >
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'test')
    steps:
      - uses: actions/checkout@v4

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish
          path: publish

      - name: App Settings Variable Substitution
        uses: microsoft/variable-substitution@v1
        with:
          files: '**/appsettings.json'
        env:
          MailerSettings.From: ${{ secrets.MAILER_SETTINGS_FROM }}
          MailerSettings.Username: ${{ secrets.MAILER_SETTINGS_USERNAME }}
          MailerSettings.Password: ${{ secrets.MAILER_SETTINGS_PASSWORD }}
          MailerSettings.Host: ${{ secrets.MAILER_SETTINGS_HOST }}
          MailerSettings.Port: ${{ secrets.MAILER_SETTINGS_PORT }}
          MailerSettings.EnableSSL: ${{ secrets.MAILER_SETTINGS_ENABLESSL }}
          Token.Secret: ${{ secrets.TOKEN_SECRET }}

      - name: Stop App Pool
        uses: bogdanbrudiu/simply-web-deploy/Stop@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}

      - name: Fetch App Pool
        uses: bogdanbrudiu/simply-web-deploy/Fetch@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          target-path: '\fetched\'
          source-path: '""'

      - name: Backup fetched DB and reuse it for TEST deployment
        shell: pwsh
        run: |
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          New-Item -ItemType Directory -Force -Path backup | Out-Null
          if (Test-Path -Path "fetched/App_Data/QSOs.db") {
            Copy-Item "fetched/App_Data/QSOs.db" "backup/QSOs-$stamp.db"
            Copy-Item "fetched/App_Data/QSOs.db" "publish/App_Data/QSOs.db" -Force
          }
          Add-Content -Path "backup/dbbackup_log.txt" -Value "Backup done on $stamp for ${env:GITHUB_REF_NAME}"

      - name: Upload DB backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-db-backup-${{ github.run_id }}
          path: backup
          retention-days: 14

      - name: Deploy App Pool
        uses: bogdanbrudiu/simply-web-deploy/Deploy@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'

      - name: Start App Pool
        if: always()
        uses: bogdanbrudiu/simply-web-deploy/Start@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}

  smoke_test_test_env:
    name: Smoke Test TEST Environment (Playwright)
    runs-on: ubuntu-latest
    needs: deploy_test
    if: needs.deploy_test.result == 'success'
    timeout-minutes: 20
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: HamEvent/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: HamEvent/ClientApp
        run: npm ci

      - name: Install Playwright browser
        working-directory: HamEvent/ClientApp
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests on TEST
        working-directory: HamEvent/ClientApp
        env:
          BASE_URL: ${{ secrets.TEST_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "TEST_BASE_URL is required in the test environment secrets." >&2
            exit 1
          fi
          npx playwright test --grep "@smoke"

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts-${{ github.run_id }}
          path: |
            HamEvent/ClientApp/playwright-report
            HamEvent/ClientApp/test-results
          retention-days: 14

  deploy_prod:
    name: Deploy to PROD
    runs-on: windows-latest
    needs: ci
    timeout-minutes: 30
    environment: prod
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target_environment == 'prod')
    steps:
      - uses: actions/checkout@v4

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish
          path: publish

      - name: App Settings Variable Substitution
        uses: microsoft/variable-substitution@v1
        with:
          files: '**/appsettings.json'
        env:
          MailerSettings.From: ${{ secrets.MAILER_SETTINGS_FROM }}
          MailerSettings.Username: ${{ secrets.MAILER_SETTINGS_USERNAME }}
          MailerSettings.Password: ${{ secrets.MAILER_SETTINGS_PASSWORD }}
          MailerSettings.Host: ${{ secrets.MAILER_SETTINGS_HOST }}
          MailerSettings.Port: ${{ secrets.MAILER_SETTINGS_PORT }}
          MailerSettings.EnableSSL: ${{ secrets.MAILER_SETTINGS_ENABLESSL }}
          Token.Secret: ${{ secrets.TOKEN_SECRET }}

      - name: Stop App Pool
        uses: bogdanbrudiu/simply-web-deploy/Stop@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}

      - name: Deploy App Pool
        uses: bogdanbrudiu/simply-web-deploy/Deploy@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'

      - name: Start App Pool
        if: always()
        uses: bogdanbrudiu/simply-web-deploy/Start@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
