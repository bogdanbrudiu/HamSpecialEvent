name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - updateversions
      - feature/**
      - bugfix/**
      - hotfix/**

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: HamEventMVP.sln
  PROJECT_PATH: HamEvent/HamEvent.csproj

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HamEvent/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: HamEvent/ClientApp
        run: npm ci

      - name: Verify i18n parity
        working-directory: HamEvent/ClientApp
        run: npm run i18n:check

      - name: Build client
        working-directory: HamEvent/ClientApp
        run: npm run build -- --configuration production

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HamEvent/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: HamEvent/ClientApp
        run: npm ci

      - name: Test client
        working-directory: HamEvent/ClientApp
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build tests
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

  publish:
    name: Publish
    needs: [build, test]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HamEvent/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: HamEvent/ClientApp
        run: npm ci

      - name: Publish build artifact
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --framework net10.0 --output ./publish --runtime win-x64 --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=false

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: publish
          retention-days: 14
