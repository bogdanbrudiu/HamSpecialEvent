name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: HamEventMVP.sln
  PROJECT_PATH: HamEvent/HamEvent.csproj

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HamEvent/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: HamEvent/ClientApp
        run: npm ci

      - name: Verify i18n parity
        working-directory: HamEvent/ClientApp
        run: npm run i18n:check

      - name: Build client
        working-directory: HamEvent/ClientApp
        run: npm run build -- --configuration production

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HamEvent/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: HamEvent/ClientApp
        run: npm ci

      - name: Test client
        working-directory: HamEvent/ClientApp
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build tests
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

  publish:
    name: Publish
    needs: [build, test]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HamEvent/ClientApp/package-lock.json

      - name: Install client dependencies
        working-directory: HamEvent/ClientApp
        run: npm ci

      - name: Publish build artifact
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --framework net10.0 --output ./publish --runtime win-x64 --self-contained true -p:PublishTrimmed=false -p:PublishSingleFile=false

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: publish
          retention-days: 14

  deploy_prod:
    name: Deploy to PROD
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 35
    environment: prod
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish
          path: publish

      - name: Verify PROD prerequisites
        shell: pwsh
        env:
          DOTNET10_HOSTING_READY: ${{ vars.DOTNET10_HOSTING_READY }}
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          if ($env:DOTNET10_HOSTING_READY -ne 'true') {
            throw 'Confirm the .NET 10 Hosting Bundle on PROD and set DOTNET10_HOSTING_READY=true in the prod environment.'
          }
          if ([string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            throw 'PROD_BASE_URL is required.'
          }

      - name: App settings substitution (PROD)
        uses: microsoft/variable-substitution@v1
        with:
          files: publish/appsettings.json
        env:
          MailerSettings.From: ${{ secrets.MAILER_SETTINGS_FROM }}
          MailerSettings.Username: ${{ secrets.MAILER_SETTINGS_USERNAME }}
          MailerSettings.Password: ${{ secrets.MAILER_SETTINGS_PASSWORD }}
          MailerSettings.Host: ${{ secrets.MAILER_SETTINGS_HOST }}
          MailerSettings.Port: ${{ secrets.MAILER_SETTINGS_PORT }}
          MailerSettings.EnableSSL: ${{ secrets.MAILER_SETTINGS_ENABLESSL }}
          Token.Secret: ${{ secrets.TOKEN_SECRET }}

      - name: Stop PROD app pool
        uses: bogdanbrudiu/simply-web-deploy/Stop@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}

      - name: Fetch PROD site for DB backup
        uses: bogdanbrudiu/simply-web-deploy/Fetch@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          target-path: '\fetched-prod\'
          source-path: '""'

      - name: Backup PROD database
        shell: pwsh
        run: |
          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          New-Item -ItemType Directory -Force -Path backup | Out-Null
          $database = 'fetched-prod/App_Data/QSOs.db'
          if (-not (Test-Path $database -PathType Leaf) -or (Get-Item $database).Length -eq 0) {
            throw "Could not find a nonempty PROD DB at $database"
          }
          Copy-Item $database "backup/prod-QSOs-$stamp.db" -Force
          if ((Get-FileHash $database -Algorithm SHA256).Hash -ne (Get-FileHash "backup/prod-QSOs-$stamp.db" -Algorithm SHA256).Hash) {
            throw 'PROD database backup verification failed.'
          }

      - name: Upload PROD DB backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-db-backup-${{ github.run_id }}
          path: backup
          retention-days: 90
          if-no-files-found: error

      - name: Deploy PROD app (preserve DB)
        uses: bogdanbrudiu/simply-web-deploy/Deploy@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'
          skip-files: 'App_Data\\QSOs.db'

      - name: Start PROD app pool
        if: always()
        uses: bogdanbrudiu/simply-web-deploy/Start@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}

      - name: Wait for PROD readiness
        shell: pwsh
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: |
          $healthUrl = "$($env:BASE_URL.TrimEnd('/'))/health/ready"
          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri $healthUrl -Method Get -TimeoutSec 10 -SkipCertificateCheck
              if ($response.StatusCode -eq 200) { exit 0 }
            }
            catch { Write-Host "Attempt $i/30 failed: $($_.Exception.Message)" }
            Start-Sleep -Seconds 5
          }
          throw "PROD readiness check failed for $healthUrl"

  smoke_test_prod_env:
    name: Smoke Test PROD Environment (Playwright)
    needs: deploy_prod
    if: needs.deploy_prod.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HamEvent/ClientApp/package-lock.json
      - name: Install client dependencies
        working-directory: HamEvent/ClientApp
        run: npm ci
      - name: Install Playwright browser
        working-directory: HamEvent/ClientApp
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests on PROD
        working-directory: HamEvent/ClientApp
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: npx playwright test --grep "@smoke"
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-prod-artifacts-${{ github.run_id }}
          path: |
            HamEvent/ClientApp/playwright-report
            HamEvent/ClientApp/test-results
          retention-days: 14

  deploy_test:
    name: Deploy to TEST
    needs: publish
    if: github.event_name == 'push' && github.ref != 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    environment: test
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish
          path: publish

      - name: Verify TEST prerequisites
        shell: pwsh
        env:
          DOTNET10_HOSTING_READY: ${{ vars.DOTNET10_HOSTING_READY }}
          BASE_URL: ${{ secrets.TEST_BASE_URL }}
        run: |
          if ($env:DOTNET10_HOSTING_READY -ne 'true') {
            throw 'Confirm the .NET 10 Hosting Bundle on TEST and set DOTNET10_HOSTING_READY=true in the test environment.'
          }
          if ([string]::IsNullOrWhiteSpace($env:BASE_URL)) {
            throw 'TEST_BASE_URL is required.'
          }

      - name: App settings substitution (TEST)
        uses: microsoft/variable-substitution@v1
        with:
          files: publish/appsettings.json
        env:
          MailerSettings.From: ${{ secrets.MAILER_SETTINGS_FROM }}
          MailerSettings.Username: ${{ secrets.MAILER_SETTINGS_USERNAME }}
          MailerSettings.Password: ${{ secrets.MAILER_SETTINGS_PASSWORD }}
          MailerSettings.Host: ${{ secrets.MAILER_SETTINGS_HOST }}
          MailerSettings.Port: ${{ secrets.MAILER_SETTINGS_PORT }}
          MailerSettings.EnableSSL: ${{ secrets.MAILER_SETTINGS_ENABLESSL }}
          Token.Secret: ${{ secrets.TOKEN_SECRET }}

      - name: Stop TEST app pool
        id: stop
        uses: bogdanbrudiu/simply-web-deploy/Stop@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}

      - name: Fetch TEST database before deployment
        uses: bogdanbrudiu/simply-web-deploy/Fetch@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          target-path: '\fetched-test\'
          source-path: '""'

      - name: Verify and back up TEST database
        shell: pwsh
        run: |
          $database = 'fetched-test/App_Data/QSOs.db'
          if (-not (Test-Path $database -PathType Leaf)) {
            throw "TEST database not found at $database; refusing deployment."
          }
          if ((Get-Item $database).Length -eq 0) {
            throw 'Fetched TEST database is empty; refusing deployment.'
          }
          New-Item -ItemType Directory -Force -Path backup | Out-Null
          Copy-Item $database 'backup/QSOs.db' -Force
          if ((Get-FileHash $database -Algorithm SHA256).Hash -ne (Get-FileHash 'backup/QSOs.db' -Algorithm SHA256).Hash) {
            throw 'TEST database backup verification failed.'
          }

      - name: Upload TEST database backup
        uses: actions/upload-artifact@v4
        with:
          name: test-db-backup-${{ github.run_id }}
          path: backup/QSOs.db
          retention-days: 14
          if-no-files-found: error

      - name: Deploy TEST app (preserve DB)
        uses: bogdanbrudiu/simply-web-deploy/Deploy@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'
          skip-files: 'App_Data\\QSOs.db'

      - name: Start TEST app pool
        if: always() && steps.stop.outcome != 'skipped'
        uses: bogdanbrudiu/simply-web-deploy/Start@main
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}

      - name: Wait for TEST readiness
        shell: pwsh
        env:
          BASE_URL: ${{ secrets.TEST_BASE_URL }}
        run: |
          $healthUrl = "$($env:BASE_URL.TrimEnd('/'))/health/ready"
          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri $healthUrl -Method Get -TimeoutSec 10 -SkipCertificateCheck
              if ($response.StatusCode -eq 200) { exit 0 }
            }
            catch { Write-Host "Attempt $i/30 failed: $($_.Exception.Message)" }
            Start-Sleep -Seconds 5
          }
          throw "TEST readiness check failed for $healthUrl"

  smoke_test_test_env:
    name: Smoke Test TEST Environment (Playwright)
    needs: deploy_test
    if: needs.deploy_test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: HamEvent/ClientApp/package-lock.json
      - name: Install client dependencies
        working-directory: HamEvent/ClientApp
        run: npm ci
      - name: Install Playwright browser
        working-directory: HamEvent/ClientApp
        run: npx playwright install --with-deps chromium
      - name: Run Playwright smoke tests on TEST
        working-directory: HamEvent/ClientApp
        env:
          BASE_URL: ${{ secrets.TEST_BASE_URL }}
        run: npx playwright test --grep "@smoke"
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts-${{ github.run_id }}
          path: |
            HamEvent/ClientApp/playwright-report
            HamEvent/ClientApp/test-results
          retention-days: 14
