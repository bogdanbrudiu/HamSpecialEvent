<h2 mat-dialog-title>{{ 'Confirm' | translate }}</h2>
<div mat-dialog-content>
  <p>{{ data.message }}</p>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ 'Cancel' | translate }}</button>
  <button mat-raised-button color="warn" (click)="onConfirm()">{{ 'OK' | translate }}</button>
</div>
