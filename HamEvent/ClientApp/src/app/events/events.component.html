<div class="events-background">
  <div class="events-container">
    <div class="events-content">
      <h1>{{'HamEvents' | translate}}</h1>
      <p *ngIf="!loaded && !eventsList.length"><em>{{'Loading...' | translate}}</em></p>
      <p *ngIf="loaded && !eventsList.length"><em>{{'No entries...' | translate}}</em></p>
    </div>
  </div>
</div>

<div class="content" fxLayout="row wrap" fxLayoutGap="16px grid" *ngIf="eventsList.length">
  <div
    [fxFlex]="(100 / gridColumns) + '%'"
    fxFlex.xs="100%"
    fxFlex.sm="33%"
    *ngFor="let event of eventsList | paginate : { itemsPerPage: tableSize, currentPage: page, totalItems: count }"
  >
    <app-event-card [event]="event"></app-event-card>
  </div>
</div>

<div class="d-flex justify-content-center" *ngIf="eventsList.length">
  <pagination-controls previousLabel="Prev" nextLabel="Next" (pageChange)="onTableDataChange($event)"></pagination-controls>
</div>
